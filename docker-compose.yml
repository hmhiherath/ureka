version: '3.8'

services:
  backend:
    build: ./backend
    container_name: triage_backend
    restart: always
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: triage_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - WDS_SOCKET_PORT=0
      - REACT_APP_BACKEND_URL=http://localhost:5000 # Critical for the useSocket hook
    stdin_open: true
    tty: true